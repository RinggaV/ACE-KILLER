name: 构建和发布ACE-KILLER

permissions:
  contents: write

on:
  push:
    branches:
      - master
    paths-ignore:
      - "VERSION"
      - "utils/version_checker.py"
  workflow_dispatch:

jobs:
  build:
    name: 构建Windows应用
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONLEGACYWINDOWSSTDIO: 1
      PIP_DISABLE_PIP_VERSION_CHECK: 1
      NUITKA_DOWNLOAD_CONFIRMATION: 1
      PYTHONOPTIMIZE: 1
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 计算版本号和更新说明
        id: release
        shell: pwsh
        run: |
          $tags = git tag --list "v*" | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }
          $latest = $tags |
            ForEach-Object { [version]$_.Substring(1) } |
            Sort-Object |
            Select-Object -Last 1

          if ($latest) {
            $version = "$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
          } else {
            $version = "1.1.4"
          }

          $previous = if ($latest) { "v$latest" } else { "" }
          if ($previous -and (git rev-parse --verify $previous 2>$null)) {
            $commits = git log "$previous..HEAD" --pretty=format:"%s"
          } else {
            $commits = git log -1 --pretty=format:"%s"
          }

          $notes = foreach ($line in ($commits -split "`n")) {
            $subject = $line.Trim()
            if (-not $subject) { continue }
            $kind = if ($subject -match '^(?i)(feat|fix|perf|refactor|docs|style|test|chore|build|ci)(\(.+?\))?!?:') {
              $Matches[1].ToLower()
            } else {
              "chore"
            }
            "- **${kind}:** $subject"
          }
          if (-not $notes) {
            $notes = @("- **chore:** 版本更新")
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "notes<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本号: $version"
          Write-Host ($notes -join "`n")

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: 缓存PySide6和Nuitka
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            ~/.cache/pip
            ~/.cache/Nuitka
            ~/.local/share/Nuitka
            ~/AppData/Local/pip/Cache
          key: ${{ runner.os }}-pyside6-nuitka-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pyside6-nuitka-

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip wheel --quiet
          pip install -r requirements.txt --quiet

      - name: 准备构建环境
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"

          [System.IO.File]::WriteAllText("$PWD\VERSION", $version)

          $versionCheckerPath = "utils/version_checker.py"
          $content = Get-Content -Path $versionCheckerPath -Raw -Encoding utf8
          $content = $content -replace '__version__ = ".*"', ('__version__ = "' + $version + '"')
          [System.IO.File]::WriteAllText("$PWD\$versionCheckerPath", $content)
          Write-Host "已写入版本号: $version"

          @("main.dist", "main.build", "main.onefile-build", "nuitka-crash-report.xml") | ForEach-Object {
            if (Test-Path $_) { Remove-Item -Recurse -Force $_ }
          }
          Get-ChildItem -Path . -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue }

      - name: 使用Nuitka打包应用程序
        shell: pwsh
        run: |
          $icon_path = "assets/icon/favicon.ico"
          if (-not (Test-Path $icon_path)) {
            Write-Warning "主图标文件不存在: $icon_path"
          }
          if (-not (Test-Path "assets/icon")) {
            Write-Error "assets/icon目录不存在"
            exit 1
          }

          python -m nuitka --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --windows-icon-from-ico=$icon_path `
            --include-data-files=$icon_path=favicon.ico `
            --include-data-dir=assets/icon=assets/icon `
            --windows-uac-admin `
            --remove-output `
            --enable-plugin=pyside6 `
            --lto=yes `
            --jobs=$env:NUMBER_OF_PROCESSORS `
            --output-filename=ACE-KILLER.exe `
            --nofollow-import-to=tkinter,numpy,scipy,matplotlib,PIL.ImageTk `
            --nofollow-import-to=PySide6.QtWebEngineWidgets `
            --nofollow-import-to=PySide6.Qt3DCore `
            --nofollow-import-to=PySide6.Qt3DRender `
            --nofollow-import-to=PySide6.QtCharts `
            --nofollow-import-to=PySide6.QtDataVisualization `
            --nofollow-import-to=PySide6.QtMultimedia `
            --nofollow-import-to=PySide6.QtPositioning `
            --nofollow-import-to=PySide6.QtBluetooth `
            --nofollow-import-to=PySide6.QtSerialPort `
            --nofollow-import-to=PySide6.QtLocation `
            --prefer-source-code `
            --python-flag=no_site `
            --python-flag=no_warnings `
            --python-flag=no_docstrings `
            --python-flag=no_asserts `
            --disable-ccache `
            --report=compilation-report.xml `
            main.py

      - name: 验证构建结果
        shell: pwsh
        run: |
          if (-not (Test-Path "main.dist/ACE-KILLER.exe")) {
            Write-Error "未生成 main.dist/ACE-KILLER.exe"
            exit 1
          }
          $fileSizeMB = [math]::Round((Get-Item "main.dist/ACE-KILLER.exe").Length / 1MB, 2)
          Write-Host "ACE-KILLER.exe 大小: ${fileSizeMB} MB"

      - name: 上传编译报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-report-v${{ steps.release.outputs.version }}
          path: compilation-report.xml
          retention-days: 30

      - name: 压缩可执行文件目录
        shell: pwsh
        run: |
          $zip_path = "ACE-KILLER-v${{ steps.release.outputs.version }}-x64.zip"
          Compress-Archive -Path "main.dist/*" -DestinationPath $zip_path -Force
          if (-not (Test-Path $zip_path)) {
            throw "压缩失败，未生成ZIP文件"
          }

      - name: 创建发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: ACE-KILLER v${{ steps.release.outputs.version }}
          body: |
            ### 更新日志
            ${{ steps.release.outputs.notes }}

            ### 安装说明
            1. 下载 zip 压缩包文件
            2. 解压到任意目录
            3. 右键点击 `ACE-KILLER.exe`，选择"以管理员身份运行"

            ### 系统要求
            - Windows 10/11 x64
            - 需要管理员权限
          draft: false
          prerelease: false
          files: |
            ACE-KILLER-v${{ steps.release.outputs.version }}-x64.zip
